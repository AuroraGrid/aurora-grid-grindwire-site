name: AURORA GRID Core Quality

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-quality.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: core
        run: python -m py_compile aurora_grid_core.py test_core.py
      - name: Test
        working-directory: core
        run: python -m unittest -v test_core.py
      - name: Smoke demo
        working-directory: core
        run: |
          python aurora_grid_core.py init --db /tmp/aurora-core.db
          python aurora_grid_core.py demo --db /tmp/aurora-core.db
          python aurora_grid_core.py verify --db /tmp/aurora-core.db
