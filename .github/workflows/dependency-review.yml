name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: dependency-files
        shell: bash
        run: |
          base_ref="origin/${{ github.event.pull_request.base.ref }}"
          if git diff --name-only "$base_ref...HEAD" | grep -Eq '(^|/)(package(-lock)?\.json|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile(\.lock)?|Cargo\.(toml|lock)|go\.(mod|sum)|Gemfile(\.lock)?|composer\.(json|lock))$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifests changed; running dependency review."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes; dependency review is not applicable."
          fi

      - name: Review dependency changes
        if: steps.dependency-files.outputs.changed == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Record non-applicable review
        if: steps.dependency-files.outputs.changed != 'true'
        run: echo "Dependency review skipped because this pull request changes no dependency manifests."
